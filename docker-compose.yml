# Local development stack: Postgres + API
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mandi
      POSTGRES_PASSWORD: mandi
      POSTGRES_DB: mandi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandi"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mandi:mandi@db:5432/mandi
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
